[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-extract"
version = "0.1.0"
description = "Fast, non-LLM YouTube video extraction: scene-cut frames, audio features, OCR"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "yt-dlp>=2024.0",
  "librosa>=0.10.0",
  "pydub>=0.25.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
ocr = ["opencv-python-headless>=4.8.0", "pytesseract>=0.3.10"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "mypy>=1.0"]
mcp = ["mcp>=1.0"]

[project.scripts]
yt-extract = "yt_extract.cli:main"
yt-extract-mcp = "yt_extract.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
